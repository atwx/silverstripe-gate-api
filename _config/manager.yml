---
Name: silvergateapi-manager
Before: '#rootroutes'
Only:
  moduleexists: 'atwx/silverstripe-gate-manager'
---
# The manager role: make API calls, and expose them over MCP. Only active where
# the gate manager is installed, because that is what holds the private keys.
Atwx\SilverGateManager\Models\ManagedSite:
  extensions:
    - Atwx\SilverGateApi\Manager\Extensions\ManagedSiteExtension

SilverStripe\Control\Director:
  rules:
    # The authorization server describes itself; gate-manager serves that.
    '.well-known/oauth-protected-resource': 'Atwx\SilverGateApi\Manager\Controllers\DiscoveryController'
    '_silvergatemcp': 'Atwx\SilverGateApi\Manager\Controllers\McpController'
